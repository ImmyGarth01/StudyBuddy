name: Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      # START YOUR SERVER BEFORE TESTS
      - name: Start the app
        run: npm start &
      
      - name: Wait for server to start
        run: sleep 5

      #  Install Chrome + xvfb for Nightwatch
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Run Nightwatch tests
      - name: Run Nightwatch tests
        run: xvfb-run --auto-servernum npm test -- --env chrome

      #  OPTIONAL: Build Docker image (if needed)
      - name: Build Docker image
        run: docker build -t studybuddy-web .

      # OPTIONAL: Push Docker image (only if you use a registry)
